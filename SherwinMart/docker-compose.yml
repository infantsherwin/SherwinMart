version: "3.9"

services:
  sherwinmart:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sherwinmart-app
    ports:
      - "8080:8080"
    environment:
      - DB_JDBC_URL=jdbc:h2:mem:sherwinmart;DB_CLOSE_DELAY=-1;MODE=Regular
      - DB_USER=sa
      - DB_PASSWORD=
    restart: unless-stopped